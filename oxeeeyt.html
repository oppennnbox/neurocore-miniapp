<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grey Tech Tunnel</title>
    <style>
        /* Чистый серый цвет из твоего примера */
        body { margin: 0; overflow: hidden; background: #cbd3e0; touch-action: none; }
        #ui { 
            position: absolute; top: 30px; width: 100%; text-align: center; 
            color: white; font-family: 'Arial Rounded MT Bold', sans-serif; 
            font-size: 50px; pointer-events: none; z-index: 10;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="ui">0</div>
    <script type="importmap">
        { "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        const scene = new THREE.Scene();
        const GREY = 0xcbd3e0; // Тот самый серый
        scene.background = new THREE.Color(GREY);
        scene.fog = new THREE.Fog(GREY, 10, 50); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Мягкий свет, чтобы серый оставался серым
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const pLight = new THREE.PointLight(0xffffff, 400, 80);
        scene.add(pLight);

        // --- ПЕРСОНАЖ ---
        const playerGroup = new THREE.Group();
        const bodyGeo = new RoundedBoxGeometry(0.5, 0.5, 0.5, 6, 0.1);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a237e, roughness: 0.1, metalness: 0.7 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        
        const wireframe = new THREE.LineSegments(
            new THREE.EdgesGeometry(bodyGeo),
            new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.5, transparent: true })
        );
        body.add(wireframe);

        function createEye() {
            const eye = new THREE.Group();
            const white = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshBasicMaterial({color: 0xffffff}));
            const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), new THREE.MeshBasicMaterial({color: 0x000000}));
            pupil.position.z = 0.08;
            eye.add(white, pupil);
            return eye;
        }
        const eyeL = createEye(); eyeL.position.set(-0.16, 0.1, 0.2);
        const eyeR = createEye(); eyeR.position.set(0.16, 0.1, 0.2);
        body.add(eyeL, eyeR);
        playerGroup.add(body);
        scene.add(playerGroup);

        // --- СЕРЫЙ ТУННЕЛЬ ---
        const R = 3.8;
        const tunnelSegments = [];
        const segmentLen = 50;

        function createTunnelSegment(z) {
            const group = new THREE.Group();
            const geo = new THREE.CylinderGeometry(R, R, segmentLen, 12, 1, true);
            // Убрал металлический блеск, чтобы цвет был ровным серым
            const mat = new THREE.MeshStandardMaterial({ 
                color: GREY, 
                side: THREE.BackSide, 
                roughness: 0.9, 
                metalness: 0.0 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = Math.PI / 2;
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.1 }));
            line.rotation.x = Math.PI / 2;

            group.add(mesh, line);
            group.position.z = z;
            scene.add(group);
            return group;
        }

        for(let i=0; i<6; i++) {
            tunnelSegments.push(createTunnelSegment(-i * segmentLen));
        }

        // Кольца сделал серыми, чтобы они не выбивались яркостью
        const rings = [];
        for(let i = 0; i < 15; i++) {
            const ringGeo = new THREE.TorusGeometry(R - 0.02, 0.02, 8, 12);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.z = -i * 15;
            scene.add(ring);
            rings.push(ring);
        }

        // --- ПРЕПЯТСТВИЯ ---
        let obstacles = [];
        let speed = 0.38;
        let score = 0;
        let gameActive = true;

        function spawnOb(z) {
            const obGeo = new THREE.CapsuleGeometry(0.42, 5.5, 10, 20);
            const obMat = new THREE.MeshStandardMaterial({ color: 0x5c6b7a, roughness: 0.2 });
            const ob = new THREE.Mesh(obGeo, obMat);
            const a = Math.random() * Math.PI * 2;
            ob.position.set(Math.cos(a) * (R - 0.4), Math.sin(a) * (R - 0.4), z);
            ob.rotation.z = a + Math.PI / 2;
            scene.add(ob);
            obstacles.push(ob);
        }
        for(let i=1; i<=15; i++) spawnOb(-i * 20);

        let tx = 0, ty = 0;
        const updateInput = (e) => {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            tx = ((x / window.innerWidth) * 2 - 1) * (R - 1);
            ty = (-(y / window.innerHeight) * 2 + 1) * (R - 1);
        };
        window.addEventListener('mousemove', updateInput);
        window.addEventListener('touchmove', updateInput);

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);

            speed += 0.00012;

            playerGroup.position.x += (tx - playerGroup.position.x) * 0.12;
            playerGroup.position.y += (ty - playerGroup.position.y) * 0.12;
            body.rotation.x += speed * 0.2;
            body.rotation.y += speed * 0.1;

            pLight.position.set(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z + 1.5);

            tunnelSegments.forEach(seg => {
                seg.position.z += speed;
                if(seg.position.z > segmentLen) seg.position.z -= segmentLen * 6;
            });

            rings.forEach((ring) => {
                ring.position.z += speed;
                if(ring.position.z > 5) ring.position.z = -220;
            });

            obstacles.forEach(ob => {
                ob.position.z += speed;
                if (playerGroup.position.distanceTo(ob.position) < 1.35) {
                    gameActive = false;
                    setTimeout(() => location.reload(), 600);
                }
                if (ob.position.z > 5) {
                    ob.position.z = -280;
                    const a = Math.random() * Math.PI * 2;
                    ob.position.set(Math.cos(a) * (R - 0.4), Math.sin(a) * (R - 0.4), -280);
                    ob.rotation.z = a + Math.PI / 2;
                    score++;
                    document.getElementById('ui').innerText = score;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
