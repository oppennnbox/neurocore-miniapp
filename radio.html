<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RadioCore | Рабочие станции РФ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent !important; 
            outline: none !important; user-select: none !important; 
        }
        
        html, body { 
            width: 100%; height: 100%; 
            font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            background: radial-gradient(circle at top, #0ea5e9 0, #020617 50%, #000000 100%);
            color: #e5e7eb; 
            animation: bgShift 14s infinite alternate ease-in-out; 
            overflow: hidden;
        }
        
        /* КАРТОЧКА В СТИЛЕ NEUROCORE */
        .card { 
            width: 100%; max-width: 540px; 
            background: rgba(15, 23, 42, 0.92); 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(14px); 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            max-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 rgba(15, 23, 42, 0.5);
            padding: 15px 16px 120px;
            margin: 0 auto;
        }
        
        .card::-webkit-scrollbar {
            width: 6px;
        }
        .card::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 3px;
        }
        .card::-webkit-scrollbar-thumb {
            background-color: #3b82f6;
            border-radius: 3px;
        }
        
        /* ЗАГОЛОВОК В СТИЛЕ NEUROCORE */
        .card-header { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .avatar { 
            width: 40px; 
            height: 40px; 
            border-radius: 12px; 
            background: conic-gradient(from 140deg, #22c55e, #22d3ee, #6366f1, #ec4899, #22c55e); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #020617; 
            font-weight: 700; 
            font-size: 18px; 
            text-shadow: 0 0 6px rgba(15, 23, 42, 0.8); 
            animation: pulseGlow 3s infinite ease-in-out; 
        }
        
        .title-block { 
            flex: 1; 
        }
        
        .title { 
            font-size: 18px; 
            font-weight: 700; 
            letter-spacing: 0.14em; 
            text-transform: uppercase; 
            color: #e0f2fe; 
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.9), 0 0 16px rgba(59, 130, 246, 0.8); 
            animation: titleGlow 4s infinite ease-in-out; 
        }
        
        .subtitle { 
            font-size: 12px; 
            color: #9ca3af; 
        }
        
        .badge { 
            font-size: 11px; 
            padding: 3px 7px; 
            border-radius: 999px; 
            background: rgba(59, 130, 246, 0.15); 
            border: 1px solid rgba(59, 130, 246, 0.6); 
            color: #bfdbfe; 
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
        }
        
        /* СТАТУСНАЯ ПАНЕЛЬ */
        .status { 
            text-align: center; 
            padding: 12px; 
            margin-bottom: 20px; 
            background: rgba(30, 64, 175, 0.2); 
            border-radius: 12px; 
            border: 1px solid rgba(129, 140, 248, 0.3);
            font-size: 14px; 
            color: #60a5fa; 
            text-shadow: 0 0 4px rgba(96, 165, 250, 0.5);
            transition: all 0.3s ease;
        }
        
        .status.playing {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.4);
            color: #86efac;
            text-shadow: 0 0 4px rgba(34, 197, 94, 0.5);
        }
        
        .status.error {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            text-shadow: 0 0 4px rgba(239, 68, 68, 0.5);
        }
        
        /* ОПТИМИЗИРОВАННАЯ СЕТКА СТАНЦИЙ */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin: 0 auto 20px;
            width: 100%;
        }
        
        .station {
            background: rgba(30, 64, 175, 0.15);
            border-radius: 14px;
            border: 1px solid rgba(129, 140, 248, 0.2);
            padding: 15px 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 140px;
            position: relative;
            overflow: hidden;
            will-change: transform, background, border-color;
        }
        
        .station:hover {
            background: rgba(30, 64, 175, 0.25);
            border-color: rgba(129, 140, 248, 0.4);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.3);
        }
        
        .station:active {
            transform: translateY(-2px) scale(1.01);
            transition-duration: 0.1s;
        }
        
        .station.playing {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(21, 128, 61, 0.15));
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.25);
        }
        
        .station.playing::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #22c55e, transparent);
            animation: playingPulse 2s infinite;
        }
        
        .station-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.3s ease;
            will-change: transform;
        }
        
        .station.playing .station-icon {
            animation: iconPulse 1.5s infinite ease-in-out;
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        
        .station-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
            color: #e0f2fe;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .station-genre {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 8px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .playing-indicator {
            position: absolute;
            bottom: 8px;
            font-size: 10px;
            font-weight: 600;
            color: #22c55e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.3s ease;
        }
        
        .station.playing .playing-indicator {
            opacity: 1;
            transform: translateY(0);
        }
        
        .indicator-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }
        
        /* КОНТРОЛЫ ВОСПРОИЗВЕДЕНИЯ */
        .player-controls {
            position: sticky;
            bottom: 100px;
            display: flex;
            gap: 8px;
            margin-top: 20px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 14px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(10px);
            z-index: 50;
        }
        
        .control-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: rgba(30, 64, 175, 0.3);
            color: #e5e7eb;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .control-btn:hover {
            background: rgba(30, 64, 175, 0.5);
            transform: translateY(-1px);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn.stop {
            background: rgba(239, 68, 68, 0.3);
        }
        
        .control-btn.stop:hover {
            background: rgba(239, 68, 68, 0.5);
        }
        
        /* АНИМАЦИИ */
        @keyframes bgShift { 
            0% { background: radial-gradient(circle at top, #0ea5e9 0, #020617 50%, #000000 100%); } 
            50% { background: radial-gradient(circle at top, #6366f1 0, #020617 55%, #000000 100%); } 
            100% { background: radial-gradient(circle at top, #ec4899 0, #020617 50%, #000000 100%); } 
        }
        
        @keyframes pulseGlow { 
            0%, 100% { box-shadow: 0 0 0 rgba(56, 189, 248, 0); } 
            50% { box-shadow: 0 0 18px rgba(56, 189, 248, 0.9); } 
        }
        
        @keyframes titleGlow { 
            0%, 100% { text-shadow: 0 0 4px rgba(56, 189, 248, 0.5), 0 0 8px rgba(59, 130, 246, 0.4); } 
            50% { text-shadow: 0 0 10px rgba(56, 189, 248, 1), 0 0 22px rgba(59, 130, 246, 0.9); } 
        }
        
        @keyframes playingPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* АДАПТИВНОСТЬ */
        @media (max-width: 768px) {
            .stations-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 540px) {
            .card {
                border-radius: 0;
                padding: 12px 12px 120px;
            }
            
            .stations-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .station {
                height: 130px;
                padding: 12px 10px;
            }
            
            .station-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            
            .station-name {
                font-size: 12px;
            }
            
            .station-genre {
                font-size: 10px;
            }
            
            .title {
                font-size: 16px;
            }
        }
        
        @media (max-width: 360px) {
            .stations-grid {
                grid-template-columns: 1fr;
                max-width: 280px;
            }
        }
        
        /* НАВИГАЦИОННАЯ ПАНЕЛЬ ИЗ ОРИГИНАЛА */
        .bottom-nav-wrapper * { -webkit-tap-highlight-color: transparent !important; outline: none !important; user-select: none !important; }

        .bottom-nav-wrapper {
            position: fixed; bottom: 0; left: 0; right: 0;
            width: 100%; z-index: 1000; pointer-events: none;
            padding: 0 8px 8px;
            background: linear-gradient(to top, rgba(2, 6, 23, 0.7) 0%, transparent 100%);
        }

        .bottom-nav {
            pointer-events: auto; display: flex; justify-content: space-evenly; align-items: center;
            background: rgba(10, 15, 30, 0.98); 
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 30px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.1); 
            border-radius: 20px; height: 70px;
            backdrop-filter: blur(25px); 
            overflow: hidden;
            margin: 0 auto;
            max-width: 460px;
        }

        .bottom-item {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 4px;
            color: #e0f2fe; font-size: 11px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; position: relative;
        }

        .bottom-item.active { color: #00f2fe; }

        .bottom-item-icon {
            width: 36px; height: 36px; border-radius: 12px;
            position: relative; overflow: hidden; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        .icon-emoji {
            font-size: 16px; position: absolute; top: 55%; left: 50%;
            transform: translate(-50%,-50%); z-index: 2;
            animation: liveEmoji 3s ease-in-out infinite;
        }

        @keyframes liveEmoji {
            0%, 100% { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%,-50%) scale(1.05) rotate(2deg); }
        }

        .bottom-item:hover .bottom-item-icon { 
            transform: translateY(-4px) scale(1.12); 
            box-shadow: 0 15px 30px rgba(59,130,246,0.4); 
        }
        .bottom-item:active .bottom-item-icon { transform: scale(0.95); }

        .holo-friends { background: linear-gradient(45deg, #ff0080, #00f2fe, #ff0080); background-size: 400% 400%; animation: holoShift 4s ease infinite; }
        .holo-wheel { background: linear-gradient(45deg, #00f2fe, #ff0080, #00f2fe); background-size: 300% 300%; animation: holoShift 5s ease infinite reverse; }
        .holo-boost { background: linear-gradient(45deg, #ff6b00, #00f2fe, #ff6b00); background-size: 400% 400%; animation: holoShift 3s ease infinite; }
        .holo-wallet { background: linear-gradient(45deg, #00f2fe, #39ff14, #00f2fe); background-size: 350% 350%; animation: holoShift 4.5s ease infinite reverse; }
        .holo-home { background: linear-gradient(45deg, #3b82f6, #8b5cf6, #3b82f6); background-size: 300% 300%; animation: holoShift 4s ease infinite; }

        .eye-normal {
            position: absolute; top: 3px; width: 6px; height: 6px; border-radius: 50%;
            z-index: 10; transition: all 0.25s ease; animation: blinkFast 2s infinite;
        }
        .eye-normal.left { left: 8px; background: rgba(0,0,0,0.85); }
        .eye-normal.right { right: 8px; background: rgba(0,0,0,0.85); }

        .eye-reacting { animation: none !important; transition: all 0.25s ease; }

        .holo-friends .eye-reacting.left { width: 8px; height: 3px; border-radius: 2px; background: #ff4444; top: 4px; left: 7px; transform: scaleX(1.3); }
        .holo-friends .eye-reacting.right { width: 8px; height: 3px; border-radius: 2px; background: #ff4444; top: 4px; right: 7px; transform: scaleX(1.3); }

        .holo-wheel .eye-reacting.left { width: 6px; height: 4px; border-radius: 50% 50% 70% 30%; background: #ffd700; top: 3px; left: 8px; transform: rotate(-15deg); }
        .holo-wheel .eye-reacting.right { width: 6px; height: 4px; border-radius: 30% 70% 50% 50%; background: #ffd700; top: 3px; right: 8px; transform: rotate(15deg); }

        .holo-boost .eye-reacting.left { width: 7px; height: 5px; border-radius: 40% 60% 50% 50%; background: linear-gradient(45deg, #ff69b4, #ff1493); top: 2px; left: 8px; box-shadow: 0 0 4px rgba(255,105,180,0.9); }
        .holo-boost .eye-reacting.right { width: 7px; height: 5px; border-radius: 50% 40% 60% 50%; background: linear-gradient(45deg, #ff69b4, #ff1493); top: 2px; right: 8px; box-shadow: 0 0 4px rgba(255,105,180,0.9); }

        .holo-wallet .eye-reacting.left { width: 6px; height: 6px; border-radius: 50%; background: #00ff88; top: 2px; left: 8px; box-shadow: 0 0 6px #00ff88; border: 1px solid #fff; }
        .holo-wallet .eye-reacting.right { width: 6px; height: 6px; border-radius: 50%; background: #00ff88; top: 2px; right: 8px; box-shadow: 0 0 6px #00ff88; border: 1px solid #fff; }

        .holo-home .eye-normal.left {
            width: 7px; height: 7px; border-radius: 2px;
            background: rgba(0,0,0,0.85);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transform: rotate(45deg);
            left: 7px; top: 4px;
        }
        
        .holo-home .eye-normal.right {
            width: 7px; height: 7px; border-radius: 2px;
            background: rgba(0,0,0,0.85);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transform: rotate(45deg);
            right: 7px; top: 4px;
        }
        
        .holo-home .eye-reacting.left {
            width: 9px; height: 9px; border-radius: 2px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transform: rotate(45deg) scale(1.1);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
            left: 6px; top: 3px;
        }
        
        .holo-home .eye-reacting.right {
            width: 9px; height: 9px; border-radius: 2px;
            background: linear-gradient(45deg, #8b5cf6, #3b82f6);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transform: rotate(45deg) scale(1.1);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.8);
            right: 6px; top: 3px;
        }

        @keyframes holoShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes blinkFast { 0%, 80%, 100% { transform: scaleY(1) rotate(45deg); } 85% { transform: scaleY(0.1) rotate(45deg); } 90% { transform: scaleY(1) rotate(45deg); } }
    </style>
</head>
<body>
    <!-- КАРТОЧКА В СТИЛЕ NEUROCORE -->
    <div class="card">
        <div class="card-header">
            <div class="avatar">📻</div>
            <div class="title-block">
                <div class="title">RadioCore</div>
                <div class="subtitle">16 рабочих станций • Прямой эфир</div>
            </div>
            <div class="badge">live</div>
        </div>
        
        <div class="status" id="status">
            🔈 Выберите станцию из списка
        </div>
        
        <div class="stations-grid" id="stationsContainer">
            <!-- Станции будут загружены через JavaScript -->
        </div>
        
        <div class="player-controls">
            <button class="control-btn stop" id="stopBtn" onclick="stopPlayback()">
                ⏹ Стоп
            </button>
            <button class="control-btn" id="prevBtn" onclick="playPrevStation()">
                ◀ Назад
            </button>
            <button class="control-btn" id="nextBtn" onclick="playNextStation()">
                ▶ Вперед
            </button>
        </div>
    </div>
    
    <!-- ОРИГИНАЛЬНАЯ НАВИГАЦИОННАЯ ПАНЕЛЬ -->
    <div class="bottom-nav-wrapper">
        <div class="bottom-nav">
            <div class="bottom-item" data-page="friends">
                <div class="bottom-item-icon holo-friends">
                    <span class="icon-emoji">👥</span>
                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>
                </div>
                <div>Друзья</div>
            </div>
            
            <div class="bottom-item" data-page="wheel">
                <div class="bottom-item-icon holo-wheel">
                    <span class="icon-emoji">🎡</span>
                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>

                <div>Колесо</div>

            <div class="bottom-item active" data-page="home">

                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>
                </div>
                <div>Радио</div>
            </div>

            <div class="bottom-item" data-page="boost">
                <div class="bottom-item-icon holo-boost">
                    <span class="icon-emoji">🚀</span>
                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>
                </div>
                <div>Буст</div>
            </div>

            <div class="bottom-item" data-page="wallet">
                <div class="bottom-item-icon holo-wallet">
                    <span class="icon-emoji">💎</span>
                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>
                </div>
                <div>Кошелёк</div>
            </div>
        </div>
    </div>

                ]
            },
            {
                name: "Радио Romantika",
                genre: "Романтическая",
                icon: "🌹",
                url: "https://romantika.hostingradio.ru/romantika96.aacp",
                backupUrls: [
                    "https://icecast-romantika.cdnvideo.ru/romantika_mp3_192kbps"
                ]
            },
            {
                name: "Радио Монте-Карло",
                genre: "Поп музыка",
                icon: "🎲",
                url: "https://icecast-montecarlo.cdnvideo.ru/montecarlo_mp3_192kbps",
                backupUrls: [
                    "https://montecarlo.hostingradio.ru/montecarlo128.mp3"
                ]
            }
        ];

        let currentAudio = null;
        let currentPlayingIndex = -1;
        let isPlaying = false;
        let currentVolume = 0.8;
        let currentUrlIndex = 0;
        let stationRetryCount = 0;
        const MAX_RETRIES = 2;

        // ЗАГРУЗКА СТАНЦИЙ
        function loadStations() {
            const container = document.getElementById('stationsContainer');
            container.innerHTML = '';
            
            stations.forEach((station, index) => {
                const stationElement = document.createElement('div');
                stationElement.className = 'station';
                stationElement.dataset.index = index;
                
                if (index === currentPlayingIndex) {
                    stationElement.classList.add('playing');
                }
                
                stationElement.innerHTML = `
                    <div class="station-icon">${station.icon}</div>
                    <div class="station-name">${station.name}</div>
                    <div class="station-genre">${station.genre}</div>
                    <div class="playing-indicator">
                        <div class="indicator-dot"></div>
                        В эфире
                    </div>
                `;
                
                stationElement.addEventListener('click', () => playStation(index));
                container.appendChild(stationElement);
            });
        }

        // ОСНОВНАЯ ФУНКЦИЯ ВОСПРОИЗВЕДЕНИЯ
        function playStation(index) {
            // Если уже играет эта же станция, просто пауза/продолжение
            if (currentPlayingIndex === index && currentAudio) {
                togglePlayPause();
                return;
            }
            
            // Останавливаем текущее воспроизведение
            stopCurrentAudio();
            
            // Снимаем выделение со всех станций
            document.querySelectorAll('.station').forEach(s => {
                s.classList.remove('playing');
            });
            
            // Обновляем UI
            currentPlayingIndex = index;
            const station = stations[index];
            updateStatus(`⏳ Загрузка: ${station.name}...`, false);
            
            // Добавляем выделение новой станции
            const stationElements = document.querySelectorAll('.station');
            if (stationElements[index]) {
                stationElements[index].classList.add('playing');
            }
            
            // Пытаемся воспроизвести
            tryPlayStation(index, 0);
        }

        function tryPlayStation(index, urlIndex) {
            const station = stations[index];
            const urls = [station.url, ...(station.backupUrls || [])];
            
            if (urlIndex >= urls.length) {
                // Все URL не сработали
                updateStatus(`❌ ${station.name} недоступно`, true);
                currentPlayingIndex = -1;
                document.querySelectorAll('.station').forEach(s => {
                    s.classList.remove('playing');
                });
                return;
            }
            
            const url = urls[urlIndex];
            currentUrlIndex = urlIndex;
            
            // Создаем новый аудио элемент
            const audio = new Audio();
            audio.crossOrigin = 'anonymous';
            audio.preload = 'none';
            audio.volume = currentVolume;
            audio.src = url;
            
            // Обработчики событий
            audio.oncanplaythrough = () => {
                audio.play().then(() => {
                    updateStatus(`▶ Слушаете: ${station.name}`, false);
                    currentAudio = audio;
                    isPlaying = true;
                    stationRetryCount = 0;
                }).catch(error => {
                    console.error('Play failed:', error);
                    tryNextUrl(index, urlIndex);
                });
            };
            
            audio.onplaying = () => {
                isPlaying = true;
            };
            
            audio.onpause = () => {
                isPlaying = false;
            };
            
            audio.onerror = (e) => {
                console.error('Audio error for', station.name, 'URL:', url, 'Error:', e);
                tryNextUrl(index, urlIndex);
            };
            
            audio.onended = () => {
                stopPlayback();
            };
            
            // Начинаем загрузку
            audio.load();
        }

        function tryNextUrl(index, currentUrlIndex) {
            stationRetryCount++;
            if (stationRetryCount <= MAX_RETRIES) {
                setTimeout(() => {
                    tryPlayStation(index, currentUrlIndex + 1);
                }, 500);
            } else {
                updateStatus('❌ Не удалось загрузить станцию', true);
                currentPlayingIndex = -1;
                document.querySelectorAll('.station').forEach(s => {
                    s.classList.remove('playing');
                });
            }
        }

        function togglePlayPause() {
            if (!currentAudio) return;
            
            if (isPlaying) {
                currentAudio.pause();
                updateStatus(`⏸ Пауза: ${stations[currentPlayingIndex].name}`, false);
            } else {
                currentAudio.play().then(() => {
                    updateStatus(`▶ Слушаете: ${stations[currentPlayingIndex].name}`, false);
                }).catch(error => {
                    console.error('Resume failed:', error);
                    // Пытаемся перезапустить с резервного URL
                    stationRetryCount = 0;
                    tryPlayStation(currentPlayingIndex, currentUrlIndex + 1);
                });
            }
        }

        function stopCurrentAudio() {
            if (currentAudio) {
                // Отключаем все обработчики
                currentAudio.oncanplaythrough = null;
                currentAudio.onplaying = null;
                currentAudio.onpause = null;
                currentAudio.onerror = null;
                currentAudio.onended = null;
                
                // Останавливаем и очищаем
                currentAudio.pause();
                currentAudio.src = '';
                currentAudio.load();
                currentAudio = null;
            }
            isPlaying = false;
            stationRetryCount = 0;
        }

        function stopPlayback() {
            stopCurrentAudio();
            
            currentPlayingIndex = -1;
            
            document.querySelectorAll('.station').forEach(s => {
                s.classList.remove('playing');
            });
            
            updateStatus('🔈 Выберите станцию из списка', false);
        }

        function playPrevStation() {
            if (currentPlayingIndex === -1) return;
            
            let newIndex = currentPlayingIndex - 1;
            if (newIndex < 0) newIndex = stations.length - 1;
            
            playStation(newIndex);
        }

        function playNextStation() {
            if (currentPlayingIndex === -1) return;
            
            let newIndex = currentPlayingIndex + 1;
            if (newIndex >= stations.length) newIndex = 0;
            
            playStation(newIndex);
        }

        function updateStatus(message, isError) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status';
            
            if (isError) {
                statusEl.classList.add('error');
            } else if (message.includes('▶')) {
                statusEl.classList.add('playing');
            }
        }

        // ГОРЯЧИЕ КЛАВИШИ
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                stopPlayback();
                e.preventDefault();
            }
            
            if (e.key === ' ' && currentPlayingIndex !== -1) {
                e.preventDefault();
                togglePlayPause();
            }
            
            if (e.key === 'ArrowRight' && currentPlayingIndex !== -1) {
                e.preventDefault();
                playNextStation();
            }
            
            if (e.key === 'ArrowLeft' && currentPlayingIndex !== -1) {
                e.preventDefault();
                playPrevStation();
            }
        });

        // КЛИК ПО ФОНУ ДЛЯ ОСТАНОВКИ
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.station') && 
                !e.target.closest('.player-controls') && 
                !e.target.closest('.status')) {
                // Не останавливаем при клике на фон
            }
        });

        // НАВИГАЦИОННАЯ ПАНЕЛЬ
        document.querySelectorAll('.bottom-item').forEach(item => {
            item.addEventListener('click', function(e) {
                const pageId = this.getAttribute('data-page');
                const icon = this.querySelector('.bottom-item-icon');
                const eyes = icon.querySelectorAll('.eye-normal');
                
                eyes.forEach(eye => eye.classList.add('eye-reacting'));
                setTimeout(() => eyes.forEach(eye => eye.classList.remove('eye-reacting')), 1200);
                
                document.querySelectorAll('.bottom-item').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                
                // Обработка нажатий
                switch(pageId) {
                    case 'home':
                        // Уже на радио
                        break;
                    case 'wheel':
                        window.location.href = 'https://oppennnbox.github.io/neurocore-miniapp/Coleso.html';
                        break;
                    case 'wallet':
                        window.location.href = 'https://oppennnbox.github.io/neurocore-miniapp/Wallet.html';
                        break;
                    case 'friends':
                        alert('👥 Раздел "Друзья" в разработке');
                        break;
                    case 'boost':
                        alert('🚀 Раздел "Буст" в разработке');
                        break;
                }
            });
        });

        // ЗАГРУЗКА ПРИ ЗАПУСКЕ
        window.addEventListener('load', () => {
            loadStations();
            
            // Останавливаем воспроизведение при закрытии
            window.addEventListener('beforeunload', () => {
                stopCurrentAudio();
            });
            
            // Пауза при скрытии вкладки
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && currentAudio && isPlaying) {
                    currentAudio.pause();
                }
            });
        });

        // ОПТИМИЗАЦИЯ ДЛЯ МОБИЛЬНЫХ
        document.addEventListener('touchstart', function() {}, {passive: true});
        document.addEventListener('touchmove', function() {}, {passive: true});
    </script>
