<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NeuroCore — Variant Best</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: #05070a; color: #fff; 
            font-family: 'Segoe UI', system-ui, sans-serif; padding: 25px 0;
        }

        .title { 
            padding: 0 20px; font-size: 24px; font-weight: 900; 
            margin-bottom: 20px; text-transform: uppercase; letter-spacing: -0.5px;
        }

        /* Невидимый скролл */
        .games-scroll {
            display: flex; gap: 14px;
            overflow-x: auto; padding: 0 20px 30px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox */
        }
        .games-scroll::-webkit-scrollbar { display: none; /* Chrome/Safari */ }

        /* Карточка */
        .card {
            flex: 0 0 155px; height: 220px;
            background: linear-gradient(145deg, #1a1f2e, #0d1117);
            border-radius: 18px; /* Твой стандарт */
            position: relative; overflow: hidden;
            scroll-snap-align: start;
            border: 1px solid rgba(255,255,255,0.08);
            text-decoration: none; color: inherit;
            display: flex; flex-direction: column;
            transition: transform 0.1s;
        }

        .card:active { transform: scale(0.96); }

        /* Центр с крупной иконкой */
        .icon-center {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* Стиль иконок (крупнее и сочнее) */
        .game-icon { 
            width: 75px; height: 75px; 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .card-footer {
            padding: 0 12px 12px;
            background: linear-gradient(to top, #05070a 60%, transparent);
        }

        .game-name { font-size: 18px; font-weight: 800; text-align: center; margin-bottom: 10px; }
        
        .play-btn { 
            background: #facc15; color: #000; 
            padding: 9px 0; border-radius: 12px; 
            font-weight: 900; text-transform: uppercase; font-size: 12px;
            text-align: center; box-shadow: 0 5px 15px rgba(250, 204, 21, 0.3);
        }
    </style>
</head>
<body>

    <div class="title">Развлечения</div>

    <div class="games-scroll">
        
        <a href="#" class="card">
            <div class="icon-center">
                <svg class="game-icon" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="gMusic" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff00ff" />
                            <stop offset="100%" style="stop-color:#7000ff" />
                        </linearGradient>
                    </defs>
                    <path d="M30 75 V25 L75 15 V65" fill="none" stroke="url(#gMusic)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="20" cy="75" r="12" fill="url(#gMusic)"/>
                    <circle cx="65" cy="65" r="12" fill="url(#gMusic)"/>
                </svg>
            </div>
            <div class="card-footer">
                <div class="game-name">Meloman</div>
                <div class="play-btn">ИГРАТЬ</div>
            </div>
        </a>

        <a href="#" class="card">
            <div class="icon-center">
                <svg class="game-icon" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="38" fill="radial-gradient(circle at 30% 30%, #ff4d4d, #800000)"/>
                    <circle cx="50" cy="50" r="38" fill="#ef4444"/>
                    <circle cx="35" cy="35" r="10" fill="#fff" fill-opacity="0.3"/>
                </svg>
            </div>
            <div class="card-footer">
                <div class="game-name">Sharik</div>
                <div class="play-btn">ИГРАТЬ</div>
            </div>
        </a>

        <a href="#" class="card">
            <div class="icon-center">
                <svg class="game-icon" viewBox="0 0 100 100">
                    <rect x="20" y="20" width="60" height="60" rx="10" fill="#3b82f6" transform="rotate(15 50 50)"/>
                    <path d="M35 35 L65 65 M65 35 L35 65" stroke="rgba(255,255,255,0.4)" stroke-width="4" transform="rotate(15 50 50)"/>
                </svg>
            </div>
            <div class="card-footer">
                <div class="game-name">Cube 3D</div>
                <div class="play-btn">ИГРАТЬ</div>
            </div>
        </a>

        <a href="#" class="card">
            <div class="icon-center">
                <svg class="game-icon" viewBox="0 0 100 100">
                    <path d="M20 80 V50 H50 V70 H80 V30" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="80" cy="30" r="6" fill="#fff"/>
                </svg>
            </div>
            <div class="card-footer">
                <div class="game-name">Zmeyka</div>
                <div class="play-btn">ИГРАТЬ</div>
            </div>
        </a>

    </div>

</body>
</html>
