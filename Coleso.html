<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NeuroCore Wheel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
        }
        body { 
            display: flex; align-items: flex-start; justify-content: center; 
            background: radial-gradient(circle at top, #0ea5e9 0, #020617 50%, #000000 100%);
            color: #e5e7eb; animation: bgShift 14s infinite alternate ease-in-out; 
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }
        .card { 
            width: 100%; max-width: 540px; 
            background: rgba(15, 23, 42, 0.92); border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(14px); display: flex; flex-direction: column; 
            height: 100vh;
            max-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 rgba(15, 23, 42, 0.5);
            padding: 15px 16px 90px;
        }
        
        .card::-webkit-scrollbar {
            width: 6px;
        }
        .card::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 3px;
        }
        .card::-webkit-scrollbar-thumb {
            background-color: #3b82f6;
            border-radius: 3px;
        }
        
        .lang-selector { display: flex; justify-content: flex-end; margin-bottom: 12px; }
        .lang-dropdown { background: rgba(30, 64, 175, 0.55); border: 1px solid rgba(129, 140, 248, 0.5); border-radius: 8px; padding: 6px 10px; color: #e5e7eb; font-size: 12px; cursor: pointer; outline: none; }
        .lang-dropdown:hover { background: rgba(30, 64, 175, 0.7); }
        
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 12px; background: conic-gradient(from 140deg, #22c55e, #22d3ee, #6366f1, #ec4899, #22c55e); display: flex; align-items: center; justify-content: center; color: #020617; font-weight: 700; font-size: 18px; text-shadow: 0 0 6px rgba(15, 23, 42, 0.8); animation: pulseGlow 3s infinite ease-in-out; }
        .title-block { flex: 1; }
        .title { font-size: 18px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #e0f2fe; text-shadow: 0 0 8px rgba(56, 189, 248, 0.9), 0 0 16px rgba(59, 130, 246, 0.8); animation: titleGlow 4s infinite ease-in-out; }
        .subtitle { font-size: 12px; color: #9ca3af; }
        .badge { font-size: 11px; padding: 3px 7px; border-radius: 999px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.6); color: #bfdbfe; text-transform: uppercase; letter-spacing: 0.08em; }
        
        .buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0 12px; }
        .btn { padding: 11px 12px; border-radius: 12px; border: 0; cursor: pointer; font-size: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease; color: #e5e7eb; letter-spacing: 0.01em; }
        .btn span.label { font-weight: 600; }
        .btn span.desc { font-size: 11px; color: #cbd5f5; }
        .btn.primary { background: linear-gradient(135deg, #2563eb, #7c3aed); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.45); }
        .btn.secondary { background: rgba(30, 64, 175, 0.55); border: 1px solid rgba(129, 140, 248, 0.5); }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(59, 130, 246, 0.45); }
        .btn:active { transform: translateY(0); box-shadow: none; }
        
        .section-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.6), transparent); margin: 20px 0; }
        
        /* Колесо — новый стиль */
        .wheel-section {
            position: relative;
            width: 100%;
            max-width: 340px;
            margin: 24px auto 10px;
            padding: 18px;
            border-radius: 24px;
            background:
                radial-gradient(circle at top, rgba(59,130,246,0.45), transparent 60%),
                radial-gradient(circle at bottom, rgba(236,72,153,0.35), transparent 65%),
                rgba(15,23,42,0.92);
            border: 1px solid rgba(148,163,184,0.35);
            box-shadow:
                0 0 25px rgba(15,23,42,0.9),
                0 0 60px rgba(59,130,246,0.45);
            backdrop-filter: blur(16px);
            animation: wheelCardFloat 6s ease-in-out infinite;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            padding: 12px;
            background:
                radial-gradient(circle at 30% 10%, rgba(248,250,252,0.18), transparent 55%),
                radial-gradient(circle at 70% 120%, rgba(59,130,246,0.4), rgba(15,23,42,0.9));
            box-shadow:
                0 18px 45px rgba(0,0,0,0.8),
                0 0 40px rgba(56,189,248,0.6);
            overflow: visible;
        }

        /* сам диск */
        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter:
                drop-shadow(0 0 18px rgba(15,23,42,0.9))
                drop-shadow(0 0 25px rgba(56,189,248,0.45));
            animation: wheelIdleGlow 10s ease-in-out infinite;
        }

        /* центр колеса – «кристалл» */
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 20%, #fefce8, #facc15 40%, #854d0e 80%);
            box-shadow:
                0 0 30px rgba(250, 204, 21, 0.85),
                0 0 65px rgba(234,179,8,0.7);
            border: 3px solid rgba(253, 224, 71, 0.9);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #111827;
            text-shadow: 0 1px 0 rgba(255,255,255,0.7);
            transition: all 0.3s ease;
        }

        /* при обычном состоянии центра, когда показывается ставка */
        .wheel-center.normal-state {
            background:
                radial-gradient(circle at 30% 20%, #0f172a, #020617 60%, #000000 100%);
            color: #e0f2fe;
            box-shadow:
                0 0 20px rgba(15,23,42,0.95),
                0 0 45px rgba(59,130,246,0.7);
            border-color: rgba(59,130,246,0.9);
        }

        /* стрелка – более аккуратная и «металлическая» */
        .wheel-pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 54px;
            height: 54px;
            z-index: 4;
            filter:
                drop-shadow(0 0 14px rgba(250, 204, 21, 0.95))
                drop-shadow(0 0 30px rgba(251, 191, 36,0.75));
        }

        /* Панель управления */
        .control-panel {
            background: rgba(17, 24, 39, 0.5);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            margin-bottom: 20px;
        }
        
        .balance-display {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        
        .balance-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #22c55e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .spin-section {
            margin-top: 20px;
        }
        
        .spin-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fefce8;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
        }
        
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.6);
        }
        
        .spin-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        
        .spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* История */
        .history-section {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        
        .history-title {
            font-size: 14px;
            color: #e0f2fe;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-list {
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            font-size: 12px;
        }
        
        .history-win {
            color: #22c55e;
            font-weight: 600;
        }
        
        .history-loss {
            color: #ef4444;
        }
        
        .meta-block { 
            margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(55, 65, 81, 0.8); 
            font-size: 11px; color: #9ca3af; display: flex; flex-direction: column; gap: 4px; 
            padding-bottom: 10px;
            margin-bottom: 0;
        }
        .meta-title { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #a5b4fc; text-shadow: 0 0 8px rgba(129, 140, 248, 0.6); }
        .meta-links { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .meta-link { color: #38bdf8; text-decoration: none; font-size: 11px; cursor: pointer; }
        .meta-link:hover { text-decoration: underline; }
        
        @media (max-width: 480px) { 
            body { 
                padding: 0;
                align-items: stretch;
            }
            .card { 
                padding: 12px 10px 85px;
                border-radius: 0;
                width: 100%;
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
            } 
            .title { font-size: 16px; } 
            .wheel-section {
                max-width: 300px;
                padding: 15px;
            }
            .balance-amount {
                font-size: 28px;
            }
        }
        
        @keyframes pulseGlow { 
            0%, 100% { box-shadow: 0 0 0 rgba(56, 189, 248, 0); } 
            50% { box-shadow: 0 0 18px rgba(56, 189, 248, 0.9); } 
        }
        @keyframes titleGlow { 
            0%, 100% { text-shadow: 0 0 4px rgba(56, 189, 248, 0.5), 0 0 8px rgba(59, 130, 246, 0.4); } 
            50% { text-shadow: 0 0 10px rgba(56, 189, 248, 1), 0 0 22px rgba(59, 130, 246, 0.9); } 
        }
        @keyframes bgShift { 
            0% { background: radial-gradient(circle at top, #0ea5e9 0, #020617 50%, #000000 100%); } 
            50% { background: radial-gradient(circle at top, #6366f1 0, #020617 55%, #000000 100%); } 
            100% { background: radial-gradient(circle at top, #ec4899 0, #020617 50%, #000000 100%); } 
        }
        
        /* Анимации колеса */
        @keyframes wheelCardFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
                box-shadow:
                    0 18px 45px rgba(0,0,0,0.8),
                    0 0 40px rgba(59,130,246,0.45);
            }
            50% {
                transform: translateY(-4px) scale(1.01);
                box-shadow:
                    0 26px 60px rgba(0,0,0,0.9),
                    0 0 55px rgba(59,130,246,0.6);
            }
        }

        @keyframes wheelIdleGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 18px rgba(15,23,42,0.9))
                    drop-shadow(0 0 25px rgba(56,189,248,0.45));
            }
            50% {
                filter:
                    drop-shadow(0 0 24px rgba(15,23,42,1))
                    drop-shadow(0 0 36px rgba(96,165,250,0.8));
            }
        }

        /* Навигационная панель */
        .bottom-nav-wrapper * { -webkit-tap-highlight-color: transparent !important; outline: none !important; user-select: none !important; }

        .bottom-nav-wrapper {
            position: fixed; bottom: 0; left: 0; right: 0;
            width: 100%; z-index: 1000; pointer-events: none;
            padding: 0 8px 8px;
            background: linear-gradient(to top, rgba(2, 6, 23, 0.7) 0%, transparent 100%);
        }

        .bottom-nav {
            pointer-events: auto; display: flex; justify-content: space-evenly; align-items: center;
            background: rgba(10, 15, 30, 0.98); 
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 30px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.1); 
            border-radius: 20px; height: 70px;
            backdrop-filter: blur(25px); 
            overflow: hidden;
            margin: 0 auto;
            max-width: 460px;
        }

        .bottom-item {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 4px;
            color: #e0f2fe; font-size: 11px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; position: relative;
        }

        .bottom-item.active { color: #00f2fe; }

        .bottom-item-icon {
            width: 36px; height: 36px; border-radius: 12px;
            position: relative; overflow: hidden; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        .icon-emoji {
            font-size: 16px; position: absolute; top: 55%; left: 50%;
            transform: translate(-50%,-50%); z-index: 2;
            animation: liveEmoji 3s ease-in-out infinite;
        }

        @keyframes liveEmoji {
            0%, 100% { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%,-50%) scale(1.05) rotate(2deg); }
        }

        .bottom-item:hover .bottom-item-icon { 
            transform: translateY(-4px) scale(1.12); 
            box-shadow: 0 15px 30px rgba(59,130,246,0.4); 
        }
        .bottom-item:active .bottom-item-icon { transform: scale(0.95); }

        .holo-friends { background: linear-gradient(45deg, #ff0080, #00f2fe, #ff0080); background-size: 400% 400%; animation: holoShift 4s ease infinite; }
        .holo-wheel { background: linear-gradient(45deg, #00f2fe, #ff0080, #00f2fe); background-size: 300% 300%; animation: holoShift 5s ease infinite reverse; }
        .holo-boost { background: linear-gradient(45deg, #ff6b00, #00f2fe, #ff6b00); background-size: 400% 400%; animation: holoShift 3s ease infinite; }
        .holo-wallet { background: linear-gradient(45deg, #00f2fe, #39ff14, #00f2fe); background-size: 350% 350%; animation: holoShift 4.5s ease infinite reverse; }

        .eye-normal {
            position: absolute; top: 3px; width: 6px; height: 6px; border-radius: 50%;
            z-index: 10; transition: all 0.25s ease; animation: blinkFast 2s infinite;
        }
        .eye-normal.left { left: 8px; background: rgba(0,0,0,0.85); }
        .eye-normal.right { right: 8px; background: rgba(0,0,0,0.85); }

        .eye-reacting { animation: none !important; transition: all 0.25s ease; }

        .holo-friends .eye-reacting.left { width: 8px; height: 3px; border-radius: 2px; background: #ff4444; top: 4px; left: 7px; transform: scaleX(1.3); }
        .holo-friends .eye-reacting.right { width: 8px; height: 3px; border-radius: 2px; background: #ff4444; top: 4px; right: 7px; transform: scaleX(1.3); }

        .holo-wheel .eye-reacting.left { width: 6px; height: 4px; border-radius: 50% 50% 70% 30%; background: #ffd700; top: 3px; left: 8px; transform: rotate(-15deg); }
        .holo-wheel .eye-reacting.right { width: 6px; height: 4px; border-radius: 30% 70% 50% 50%; background: #ffd700; top: 3px; right: 8px; transform: rotate(15deg); }

        .holo-boost .eye-reacting.left { width: 7px; height: 5px; border-radius: 40% 60% 50% 50%; background: linear-gradient(45deg, #ff69b4, #ff1493); top: 2px; left: 8px; box-shadow: 0 0 4px rgba(255,105,180,0.9); }
        .holo-boost .eye-reacting.right { width: 7px; height: 5px; border-radius: 50% 40% 60% 50%; background: linear-gradient(45deg, #ff69b4, #ff1493); top: 2px; right: 8px; box-shadow: 0 0 4px rgba(255,105,180,0.9); }

        .holo-wallet .eye-reacting.left { width: 6px; height: 6px; border-radius: 50%; background: #00ff88; top: 2px; left: 8px; box-shadow: 0 0 6px #00ff88; border: 1px solid #fff; }
        .holo-wallet .eye-reacting.right { width: 6px; height: 6px; border-radius: 50%; background: #00ff88; top: 2px; right: 8px; box-shadow: 0 0 6px #00ff88; border: 1px solid #fff; }

        @keyframes holoShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes blinkFast { 0%, 80%, 100% { transform: scaleY(1); } 85% { transform: scaleY(0.1); } 90% { transform: scaleY(1); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="lang-selector">
            <select class="lang-dropdown" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="ru">🇷🇺 Русский</option>
                <option value="en">🇬🇧 English</option>
                <option value="tt">🇹🇹 Татарский</option>
            </select>
        </div>
 
        <div class="card-header">
            <div class="avatar">NC</div>
            <div class="title-block">
                <div class="title">NEUROCORE WHEEL</div>
                <div class="subtitle" id="subtitle">Испытай удачу · Выигрывай призы · 18+</div>
            </div>
            <div class="badge">LIVE</div>
        </div>
 
        <!-- Кнопки ставок -->
        <div class="buttons-grid">
            <button class="btn secondary" onclick="setBet(10)">
                <span class="label">10</span>
                <span class="desc">Минимальная ставка</span>
            </button>
            <button class="btn secondary" onclick="setBet(50)">
                <span class="label">50</span>
                <span class="desc">Средняя ставка</span>
            </button>
            <button class="btn primary" onclick="setBet(100)">
                <span class="label">100</span>
                <span class="desc">Высокая ставка</span>
            </button>
            <button class="btn secondary" onclick="setBet(500)">
                <span class="label">500</span>
                <span class="desc">Максимальная ставка</span>
            </button>
        </div>
 
        <div class="section-divider"></div>
 
        <!-- Колесо -->
        <div class="wheel-section">
            <div class="wheel-container">
                <canvas class="wheel-canvas" id="wheelCanvas" width="400" height="400"></canvas>
                <div class="wheel-center normal-state" id="wheelCenter">100</div>
                <div class="wheel-pointer">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="pointerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fef9c3"/>
                                <stop offset="50%" stop-color="#fbbf24"/>
                                <stop offset="100%" stop-color="#92400e"/>
                            </linearGradient>
                        </defs>
                        <path d="M50 5 L65 50 L95 50 L70 75 L80 95 L50 85 L20 95 L30 75 L5 50 L35 50 Z" fill="url(#pointerGradient)"/>
                    </svg>
                </div>
            </div>
        </div>
 
        <!-- Панель управления -->
        <div class="control-panel">
            <div class="balance-display">
                <div class="balance-label" id="balanceLabel">ВАШ БАЛАНС</div>
                <div class="balance-amount" id="balanceAmount">1,500</div>
            </div>
            
            <div class="spin-section">
                <button class="spin-btn" id="spinButton" onclick="spinWheel()">
                    <span>✨</span>
                    <span id="spinText">КРУТИТЬ КОЛЕСО</span>
                    <span>✨</span>
                </button>
            </div>
        </div>
 
        <!-- История -->
        <div class="history-section">
            <div class="history-title">
                <span id="historyTitle">ПОСЛЕДНИЕ ИГРЫ</span>
                <button class="meta-link" onclick="clearHistory()" style="font-size: 10px;">Очистить</button>
            </div>
            <div class="history-list" id="historyList">
                <!-- История будет добавляться здесь динамически -->
            </div>
        </div>
 
        <div class="meta-block">
            <div class="meta-title">WHEEL SYSTEM</div>
            <div class="meta-links">
                <a class="meta-link" href="#" onclick="showRules()" id="rulesLink">Правила игры</a>
                <a class="meta-link" href="https://t.me/genuis_neo_bot" target="_blank" id="devLink">Поддержка</a>
            </div>
        </div>
    </div>

    <!-- Навигационная панель -->
    <div class="bottom-nav-wrapper">
        <div class="bottom-nav">
            <div class="bottom-item" data-page="friends" onclick="switchPage('friends')">
                <div class="bottom-item-icon holo-friends">
                    <span class="icon-emoji">👥</span>
                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>
                </div>
                <div>Друзья</div>
            </div>
            
            <div class="bottom-item active" data-page="wheel" onclick="switchPage('wheel')">
                <div class="bottom-item-icon holo-wheel">
                    <span class="icon-emoji">🎡</span>
                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>
                </div>
                <div>Колесо</div>
            </div>

            <div class="bottom-item" data-page="boost" onclick="switchPage('boost')">
                <div class="bottom-item-icon holo-boost">
                    <span class="icon-emoji">🚀</span>
                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>
                </div>
                <div>Буст</div>
            </div>

            <div class="bottom-item" data-page="wallet" onclick="switchPage('wallet')">
                <div class="bottom-item-icon holo-wallet">
                    <span class="icon-emoji">💎</span>
                    <div class="eye-normal left"></div>
                    <div class="eye-normal right"></div>
                </div>
                <div>Кошелёк</div>
            </div>
        </div>
    </div>
 
    <script>
        let balance = 1500;
        let currentBet = 100;
        let isSpinning = false;
        let currentLang = 'ru';
        let gameHistory = [];
        const tg = window.Telegram?.WebApp || {};
        
        const wheelSegments = [
            ['#EF4444', 0, 'ПРОИГРЫШ'],
            ['#F59E0B', 2, 'x2'],
            ['#10B981', 1.5, 'x1.5'],
            ['#3B82F6', 3, 'x3'],
            ['#8B5CF6', 5, 'ДЖЕКПОТ'],
            ['#EC4899', 0.5, 'x0.5'],
            ['#06D6A0', 2, 'x2'],
            ['#FBBF24', 1, 'x1']
        ];
        
        const translations = {
            ru: {
                subtitle: "Испытай удачу · Выигрывай призы · 18+",
                balanceLabel: "ВАШ БАЛАНС",
                spinText: "КРУТИТЬ КОЛЕСО",
                historyTitle: "ПОСЛЕДНИЕ ИГРЫ",
                rulesLink: "Правила игры",
                devLink: "Поддержка",
                winMessage: "ПОБЕДА",
                loseMessage: "ПРОИГРЫШ",
                jackpotMessage: "ДЖЕКПОТ",
                rulesTitle: "Правила игры",
                rulesText: "1. Выберите ставку\n2. Нажмите 'Крутить колесо'\n3. Если выпадает множитель - ваша ставка умножается\n4. Джекпот умножает ставку в 5 раз!\n5. Проигрыш - вы теряете ставку"
            },
            en: {
                subtitle: "Test your luck · Win prizes · 18+",
                balanceLabel: "YOUR BALANCE",
                spinText: "SPIN WHEEL",
                historyTitle: "RECENT GAMES",
                rulesLink: "Game Rules",
                devLink: "Support",
                winMessage: "WIN",
                loseMessage: "LOSE",
                jackpotMessage: "JACKPOT",
                rulesTitle: "Game Rules",
                rulesText: "1. Select your bet\n2. Click 'Spin Wheel'\n3. If multiplier hits - your bet is multiplied\n4. Jackpot multiplies bet by 5!\n5. Lose - you lose your bet"
            },
            tt: {
                subtitle: "Бәхет сына · Бүләкләр җиң · 18+",
                balanceLabel: "СЕЗНЕҢ БАЛАНСЫ",
                spinText: "ЧӘРХӘНЕ ӘЙЛӘНДЕР",
                historyTitle: "СОҢГЫ УЕННАР",
                rulesLink: "Уен кагыйдәләре",
                devLink: "Ярдәм",
                winMessage: "ҖИҢҮ",
                loseMessage: "ҖИҒЕЛҮ",
                jackpotMessage: "ДЖЕКПОТ",
                rulesTitle: "Уен кагыйдәләре",
                rulesText: "1. Ставка сайлагыз\n2. 'Чәрхәне әйләндер' басыгыз\n3. Множитель төшсә - ставкагыз тапкырлана\n4. Джекпот ставканы 5 тапкыр арттыра!\n5. Җигелү - ставканы югалтасыз"
            }
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            initWheel();
            updateBalance();
            updateHistory();
            loadLanguage();
            loadFromLocalStorage();
            
            if (tg.initDataUnsafe) {
                tg.expand();
            }
        });
        
        function initWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 40;
            
            drawWheel(ctx, centerX, centerY, radius, 0);
        }
        
        function drawWheel(ctx, centerX, centerY, radius, rotation) {
            const segmentAngle = (2 * Math.PI) / wheelSegments.length;
            
            ctx.clearRect(0, 0, centerX * 2, centerY * 2);
            
            // Внешняя обводка
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 8, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            for (let i = 0; i < wheelSegments.length; i++) {
                const startAngle = i * segmentAngle + rotation;
                const endAngle = (i + 1) * segmentAngle + rotation;
                
                // Градиент для сектора
                const gradient = ctx.createLinearGradient(
                    centerX + Math.cos(startAngle) * radius,
                    centerY + Math.sin(startAngle) * radius,
                    centerX + Math.cos(endAngle) * radius,
                    centerY + Math.sin(endAngle) * radius
                );
                
                gradient.addColorStop(0, wheelSegments[i][0]);
                gradient.addColorStop(1, adjustColor(wheelSegments[i][0], -30));
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.strokeStyle = '#0F172A';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + segmentAngle / 2);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 18px Roboto';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                const text = wheelSegments[i][2];
                ctx.fillText(text, radius * 0.65, 5);
                
                if (text === 'ДЖЕКПОТ') {
                    ctx.font = 'bold 14px Roboto';
                    ctx.fillStyle = '#FFD700';
                    ctx.fillText('5x', radius * 0.65, 25);
                }
                
                ctx.restore();
            }
            
            // Внутренний круг
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, 2 * Math.PI);
            const innerGradient = ctx.createRadialGradient(
                centerX, centerY, 5,
                centerX, centerY, 25
            );
            innerGradient.addColorStop(0, 'rgba(56, 189, 248, 0.8)');
            innerGradient.addColorStop(1, 'rgba(30, 41, 59, 0.8)');
            ctx.fillStyle = innerGradient;
            ctx.fill();
        }
        
        function adjustColor(color, amount) {
            let usePound = false;
            
            if (color[0] === "#") {
                color = color.slice(1);
                usePound = true;
            }
            
            const num = parseInt(color, 16);
            let r = (num >> 16) + amount;
            let g = ((num >> 8) & 0x00FF) + amount;
            let b = (num & 0x0000FF) + amount;
            
            r = Math.min(Math.max(0, r), 255);
            g = Math.min(Math.max(0, g), 255);
            b = Math.min(Math.max(0, b), 255);
            
            return (usePound ? "#" : "") + (b | (g << 8) | (r << 16)).toString(16).padStart(6, '0');
        }
        
        function setBet(amount) {
            if (isSpinning) return;
            currentBet = amount;

            const center = document.getElementById('wheelCenter');
            center.textContent = amount;
            center.classList.add('normal-state');
            center.style.fontSize = '18px';

            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('primary');
                btn.classList.add('secondary');
            });

            const betButtons = document.querySelectorAll('.btn');
            const betIndex = [10, 50, 100, 500].indexOf(amount);
            if (betIndex !== -1) {
                betButtons[betIndex].classList.remove('secondary');
                betButtons[betIndex].classList.add('primary');
            }

            saveToLocalStorage();
        }
        
        function spinWheel() {
            if (isSpinning) return;
            if (balance < currentBet) {
                alert('Недостаточно средств!');
                return;
            }
            
            isSpinning = true;
            const spinBtn = document.getElementById('spinButton');
            const wheelCenter = document.getElementById('wheelCenter');
            
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<span>🌀</span><span>КРУТИТСЯ...</span><span>🌀</span>';
            
            balance -= currentBet;
            updateBalance();
            
            const winningSegment = Math.floor(Math.random() * wheelSegments.length);
            const multiplier = wheelSegments[winningSegment][1];
            
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 40;
            
            let rotation = 0;
            const totalRotation = 5 * 2 * Math.PI + winningSegment * (2 * Math.PI / wheelSegments.length);
            const duration = 3000;
            const startTime = Date.now();
            
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 3);
                rotation = easeOut * totalRotation;
                
                drawWheel(ctx, centerX, centerY, radius, rotation);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    finishSpin(multiplier, winningSegment);
                }
            }
            
            animate();
        }
        
        function finishSpin(multiplier, segmentIndex) {
            const spinBtn = document.getElementById('spinButton');
            const wheelCenter = document.getElementById('wheelCenter');
            const t = translations[currentLang];

            let winAmount = 0;
            let resultText = '';

            wheelCenter.classList.remove('normal-state');

            if (multiplier > 0) {
                winAmount = Math.floor(currentBet * multiplier);
                balance += winAmount;
                resultText = `${t.winMessage} +${winAmount}`;

                if (multiplier === 5) {
                    resultText = `🎉 ${t.jackpotMessage} +${winAmount} 🎉`;
                    wheelCenter.style.background =
                        'radial-gradient(circle at 30% 20%, #fefce8, #facc15 40%, #854d0e 80%)';
                    wheelCenter.style.color = '#111827';
                } else {
                    wheelCenter.style.background =
                        'radial-gradient(circle at 30% 20%, #22c55e, #16a34a 70%, #052e16 100%)';
                    wheelCenter.style.color = '#e5fdf5';
                }
            } else {
                resultText = `${t.loseMessage} -${currentBet}`;
                wheelCenter.style.background =
                    'radial-gradient(circle at 30% 20%, #fee2e2, #ef4444 55%, #7f1d1d 100%)';
                wheelCenter.style.color = '#fef2f2';
            }

            updateBalance();

            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            addToHistory({
                bet: currentBet,
                win: winAmount,
                multiplier: multiplier,
                result: resultText,
                time: timeStr
            });

            wheelCenter.textContent = multiplier === 0 ? '0' : `x${multiplier}`;
            wheelCenter.style.fontSize = '22px';

            setTimeout(() => {
                spinBtn.disabled = false;
                spinBtn.innerHTML = '<span>✨</span><span id="spinText">' + t.spinText + '</span><span>✨</span>';

                wheelCenter.textContent = currentBet;
                wheelCenter.classList.add('normal-state');
                wheelCenter.style.fontSize = '18px';

                isSpinning = false;
                saveToLocalStorage();
            }, 2000);

            showNotification(resultText);
        }
        
        function updateBalance() {
            document.getElementById('balanceAmount').textContent = 
                balance.toLocaleString('ru-RU');
        }
        
        function addToHistory(game) {
            gameHistory.unshift(game);
            if (gameHistory.length > 5) {
                gameHistory = gameHistory.slice(0, 5);
            }
            updateHistory();
        }
        
        function updateHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            gameHistory.forEach(game => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <span>${game.time}</span>
                    <span class="${game.win > 0 ? 'history-win' : 'history-loss'}">
                        ${game.result}
                    </span>
                `;
                historyList.appendChild(item);
            });
        }
        
        function showNotification(message) {
            if (tg.showAlert) {
                tg.showAlert(message);
            }
        }
        
        function showRules() {
            const t = translations[currentLang];
            const message = `${t.rulesTitle}:\n\n${t.rulesText}`;
            
            if (tg.showAlert) {
                tg.showAlert(message);
            } else {
                alert(message);
            }
        }
        
        function clearHistory() {
            if (confirm('Очистить историю игр?')) {
                gameHistory = [];
                updateHistory();
                saveToLocalStorage();
            }
        }
        
        function switchPage(page) {
            document.querySelectorAll('.bottom-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-page="${page}"]`).classList.add('active');
            
            const messages = {
                'friends': '👥 Раздел "Друзья" в разработке',
                'wheel': '🎡 Вы уже в разделе "Колесо"',
                'boost': '🚀 Раздел "Буст" скоро откроется',
                'wallet': '💎 Раздел "Кошелёк" в разработке'
            };
            
            if (page !== 'wheel') {
                showNotification(messages[page]);
            }
        }
        
        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang] || translations.ru;
            
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('balanceLabel').textContent = t.balanceLabel;
            document.getElementById('spinText').textContent = t.spinText;
            document.getElementById('historyTitle').textContent = t.historyTitle;
            document.getElementById('rulesLink').textContent = t.rulesLink;
            document.getElementById('devLink').textContent = t.devLink;
            
            localStorage.setItem('wheel_lang', lang);
        }
        
        function loadLanguage() {
            const savedLang = localStorage.getItem('wheel_lang') || 'ru';
            document.getElementById('langSelect').value = savedLang;
            changeLanguage(savedLang);
        }
        
        function saveToLocalStorage() {
            const data = {
                balance: balance,
                history: gameHistory,
                bet: currentBet
            };
            localStorage.setItem('wheel_data', JSON.stringify(data));
        }
        
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('wheel_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    balance = data.balance || 1500;
                    gameHistory = data.history || [];
                    currentBet = data.bet || 100;
                    
                    setBet(currentBet);
                    updateBalance();
                    updateHistory();
                } catch (e) {
                    console.error('Ошибка загрузки данных:', e);
                }
            }
        }
    </script>
</body>
</html>
