<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Genuis Neo Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f0f0f5);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --accent: var(--tg-theme-button-color, #3390ec);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: calc(15px + env(safe-area-inset-top)) 15px calc(15px + env(safe-area-inset-bottom)) 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header { margin-bottom: 10px; flex-shrink: 0; }
        h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        .sub-text { color: var(--hint); font-size: 14px; margin-top: 4px; }

        .carousel-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            perspective: 1000px;
            margin: 10px 0;
            min-height: 0;
        }

        .news-card {
            position: absolute;
            width: 100%;
            max-width: 400px;
            max-height: 100%;
            background: var(--sec-bg);
            border-radius: 35px; /* Скругление труб */
            padding: 0; /* Убираем падинг, чтобы фото прилегало сверху */
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: scale(0.8) translateY(40px);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .news-card.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            z-index: 5;
        }

        .news-card.prev {
            opacity: 0;
            transform: scale(0.9) translateY(-100px) rotate(-5deg);
            z-index: 1;
        }

        /* Контейнер для фото */
        .card-image {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            /* Закругляем углы трубы внутри для картинки */
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .card-content {
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .card-text {
            font-size: 16px;
            line-height: 1.4;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 10px;
            user-select: text;
            word-wrap: break-word;
        }

        .card-text::-webkit-scrollbar { width: 4px; }
        .card-text::-webkit-scrollbar-thumb { background: var(--hint); border-radius: 10px; }

        .card-time {
            font-size: 11px;
            color: var(--hint);
            text-align: right;
            margin-top: auto;
            flex-shrink: 0;
        }

        .dots {
            display: flex; gap: 6px; justify-content: center; margin-bottom: 15px; flex-shrink: 0;
        }
        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--hint); opacity: 0.3; transition: 0.3s;
        }
        .dot.active { opacity: 1; background: var(--accent); transform: scale(1.3); }

        .main-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 22px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(51, 144, 236, 0.3);
            margin-bottom: 5px;
            transition: transform 0.1s;
        }
        .main-btn:active { transform: scale(0.98); }

        @media (max-height: 600px) {
            .card-image { height: 120px; }
            .card-text { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Genuis Neo</h1>
        <div class="sub-text">Новости и медиа канала</div>
    </div>

    <div class="carousel-wrapper" id="carousel"></div>

    <div class="dots" id="dots"></div>

    <button class="main-btn" onclick="window.location.href='https://t.me/genuis_neo_bot'">Подписаться на канал</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor(tg.themeParams.bg_color || '#ffffff');

        const CHANNEL_URL = 'https://t.me/s/genuis_neo_bot';
        let posts = [];
        let currentIndex = 0;

        function formatToMSK(timeStr) {
            if (!timeStr) return '';
            try {
                const date = new Date(timeStr);
                if (isNaN(date.getTime())) return timeStr;
                return date.toLocaleString('ru-RU', {
                    timeZone: 'Europe/Moscow',
                    day: '2-digit', month: '2-digit', year: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                }).replace(',', '');
            } catch (e) { return timeStr; }
        }

        async function loadNews() {
            try {
                // Allorigins кеширует данные, добавляем временную метку для скорости
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(CHANNEL_URL)}&_=${Date.now()}`);
                const data = await response.json();
                const doc = new DOMParser().parseFromString(data.contents, 'text/html');
                
                const messages = doc.querySelectorAll('.tgme_widget_message');
                let loaded = [];

                // Берем последние 10 сообщений
                const start = Math.max(0, messages.length - 10);
                for (let i = messages.length - 1; i >= start; i--) {
                    const msg = messages[i];
                    const textEl = msg.querySelector('.tgme_widget_message_text');
                    const timeEl = msg.querySelector('time');
                    const photoEl = msg.querySelector('.tgme_widget_message_photo_wrap');

                    let imgUrl = '';
                    if (photoEl) {
                        const style = photoEl.getAttribute('style');
                        const urlMatch = style.match(/url\(['"]?([^'"]+)['"]?\)/);
                        if (urlMatch) imgUrl = urlMatch[1];
                    }

                    if (textEl || imgUrl) {
                        loaded.push({
                            text: textEl ? textEl.innerHTML : '',
                            time: formatToMSK(timeEl ? (timeEl.getAttribute('datetime') || timeEl.innerText) : ''),
                            image: imgUrl
                        });
                    }
                }
                posts = loaded;
                render();
            } catch (e) {
                document.getElementById('carousel').innerHTML = "Загрузка...";
            }
        }

        function render() {
            const container = document.getElementById('carousel');
            const dotsContainer = document.getElementById('dots');
            container.innerHTML = '';
            dotsContainer.innerHTML = '';
            
            posts.forEach((post, i) => {
                const card = document.createElement('div');
                card.className = `news-card ${i === 0 ? 'active' : ''}`;
                card.id = `card-${i}`;

                let imageHtml = post.image ? `<div class="card-image" style="background-image: url('${post.image}')"></div>` : '';
                
                card.innerHTML = `
                    ${imageHtml}
                    <div class="card-content">
                        <div class="card-text">${post.text}</div>
                        <div class="card-time">${post.time}</div>
                    </div>
                `;
                container.appendChild(card);

                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            });

            initSwipe();
        }

        function showCard(index) {
            if (index < 0 || index >= posts.length) return;
            document.querySelectorAll('.news-card').forEach((c, i) => {
                c.classList.remove('active', 'prev');
                if (i < index) c.classList.add('prev');
                if (i === index) c.classList.add('active');
            });
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });
            currentIndex = index;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function initSwipe() {
            let startX = 0;
            const container = document.getElementById('carousel');
            container.ontouchstart = e => startX = e.touches[0].clientX;
            container.ontouchend = e => {
                let diff = startX - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) showCard(currentIndex + 1);
                    else showCard(currentIndex - 1);
                }
            };
        }

        loadNews();
        // Авто-обновление каждые 30 секунд для скорости
        setInterval(loadNews, 30000);
    </script>
</body>
  </html>
