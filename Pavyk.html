<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Spider MULTITOUCH PRO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at center, #0a0512 0%, #000 70%);
      overflow: hidden;
      height: 100vh;
      cursor: none;
      color: #fff;
      font-family: system-ui, sans-serif;
      touch-action: none;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .cursor-dot {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 20px currentColor;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      transition: all 0.08s ease;
    }

    .info {
      position: fixed;
      left: 50%;
      top: 15px;
      transform: translateX(-50%);
      color: #a8b0c4;
      font-size: 12px;
      z-index: 20;
      text-align: center;
      padding: 8px 16px;
      background: rgba(10,5,18,0.9);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body>
  <div class="info">🕷️ Smart Spiders — каждый тянется к ближайшему пальцу!</div>
  
  <div class="cursor-dot finger-0" id="cursorDot0" style="opacity:0"></div>
  <div class="cursor-dot finger-1" id="cursorDot1" style="opacity:0"></div>
  <div class="cursor-dot finger-2" id="cursorDot2" style="opacity:0"></div>
  <div class="cursor-dot finger-3" id="cursorDot3" style="opacity:0"></div>
  <div class="cursor-dot finger-4" id="cursorDot4" style="opacity:0"></div>
  
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    
    const cursorDots = [];
    for(let i = 0; i < 5; i++) {
      cursorDots.push(document.getElementById(`cursorDot${i}`));
    }

    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    // 5 пальцев
    const fingers = [];
    for(let i = 0; i < 5; i++) {
      fingers.push({ 
        x: w/2, 
        y: h/2, 
        active: false, 
        id: i,
        color: `hsl(${i * 72}, 70%, 65%)`
      });
    }

    // функция обновления пальца
    function updateFinger(id, x, y, active) {
      fingers[id].x = x;
      fingers[id].y = y;
      fingers[id].active = active;
      
      const dot = cursorDots[id];
      dot.style.left = x + "px";
      dot.style.top = y + "px";
      dot.style.opacity = active ? "1" : "0";
      dot.style.color = fingers[id].color;
    }

    // МЫШЬ
    window.addEventListener("mousemove", (e) => {
      updateFinger(0, e.clientX, e.clientY, true);
    });

    // TOUCH события
    window.addEventListener("touchstart", (e) => {
      e.preventDefault();
      for(let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const fingerId = Math.min(touch.identifier, 4);
        updateFinger(fingerId, touch.clientX, touch.clientY, true);
      }
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      e.preventDefault();
      for(let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const fingerId = Math.min(touch.identifier, 4);
        updateFinger(fingerId, touch.clientX, touch.clientY, true);
      }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
      e.preventDefault();
      for(let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const fingerId = Math.min(touch.identifier, 4);
        updateFinger(fingerId, fingers[fingerId].x, fingers[fingerId].y, false);
      }
    }, { passive: false });

    // ФОНОВЫЕ ЧАСТИЦЫ
    const bgParticles = [];
    const bgCount = 220;
    for(let i = 0; i < bgCount; i++) {
      bgParticles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.3,
        alpha: Math.random() * 0.5 + 0.1,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.3
      });
    }

    // 5 умных пауков
    const spiders = [];
    for(let i = 0; i < 5; i++) {
      spiders.push(createSpider(w/2 + (i-2)*50, h/2 + (i-2)*50));
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createSpider(x, y) {
      return {
        x, y,
        vx: 0, vy: 0,
        trail: [],
        targetFingerId: null,
        legs: Array.from({ length: 8 }, (_, i) => ({
          angle: (Math.PI * 2 * i) / 8,
          phase: Math.random() * Math.PI * 2,
          length: rand(32, 45),
          thickness: rand(1.5, 2.4)
        })),
        bodyScale: 1,
        pulsePhase: 0,
        hue: 180 + Math.random() * 60
      };
    }

    // ✅ МАГИЯ: распределяем пауков по ближайшим пальцам
    function assignSpidersToFingers() {
      const activeFingers = fingers.filter(f => f.active);
      if(activeFingers.length === 0) {
        spiders.forEach(s => s.targetFingerId = null);
        return;
      }

      spiders.forEach(spider => {
        let bestId = null;
        let bestDist = Infinity;
        
        activeFingers.forEach(finger => {
          const dx = finger.x - spider.x;
          const dy = finger.y - spider.y;
          const distSq = dx*dx + dy*dy;
          
          if(distSq < bestDist) {
            bestDist = distSq;
            bestId = finger.id;
          }
        });
        
        spider.targetFingerId = bestId;
      });
    }

    function updateBg(dt) {
      for(const p of bgParticles) {
        p.x += p.speedX * dt * 0.01;
        p.y += p.speedY * dt * 0.01;
        if(p.x < 0) p.x = w;
        if(p.x > w) p.x = 0;
        if(p.y < 0) p.y = h;
        if(p.y > h) p.y = 0;
      }
    }

    function drawBg() {
      ctx.fillStyle = "#0a0512";
      ctx.fillRect(0, 0, w, h);
      
      ctx.save();
      for(const p of bgParticles) {
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        gradient.addColorStop(0, `rgba(100,150,255,${p.alpha})`);
        gradient.addColorStop(1, "rgba(100,150,255,0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function updateSpider(spider, dt) {
      let targetX = w / 2;
      let targetY = h / 2;

      // тянемся к ближайшему пальцу
      if(spider.targetFingerId !== null) {
        const finger = fingers[spider.targetFingerId];
        if(finger && finger.active) {
          targetX = finger.x;
          targetY = finger.y;
        }
      }

      const dx = targetX - spider.x;
      const dy = targetY - spider.y;
      const dist = Math.hypot(dx, dy) || 1;

      const speed = 0.9;
      const ax = (dx / dist) * speed;
      const ay = (dy / dist) * speed;

      spider.vx += ax * dt * 0.1;
      spider.vy += ay * dt * 0.1;
      spider.vx *= 0.9;
      spider.vy *= 0.9;
      spider.x += spider.vx * dt * 0.08;
      spider.y += spider.vy * dt * 0.08;

      spider.trail.push({ x: spider.x, y: spider.y });
      if(spider.trail.length > 28) spider.trail.shift();

      const t = performance.now() * 0.004;
      const moveSpeed = Math.hypot(spider.vx, spider.vy) * 0.15;
      spider.legs.forEach((leg, i) => {
        const forwardLegs = i % 2 === 0;
        leg.phase = t * (forwardLegs ? 1.6 : 1.4) + i * 0.7 + moveSpeed;
      });

      spider.pulsePhase += dt * 0.012;
      spider.bodyScale = 1 + Math.sin(spider.pulsePhase) * 0.12;
    }

    function drawLeg(leg, cx, cy, time, hue) {
      const baseAngle = leg.angle;
      const walk = Math.sin(leg.phase) * 0.7;
      const sway = Math.sin(time * 0.009 + leg.angle) * 0.2;
      const angle = baseAngle + walk + sway;

      const joint1Dist = 15;
      const joint2Dist = leg.length - 15;

      const j1x = Math.cos(angle) * joint1Dist;
      const j1y = Math.sin(angle) * joint1Dist;
      const j2x = Math.cos(angle) * joint2Dist;
      const j2y = Math.sin(angle) * joint2Dist;

      const legGradient = ctx.createLinearGradient(cx, cy, cx + j2x, cy + j2y);
      legGradient.addColorStop(0, `hsl(${hue}, 85%, 98%)`);
      legGradient.addColorStop(0.4, `hsl(${hue}, 75%, 88%)`);
      legGradient.addColorStop(1, `hsl(${hue}, 65%, 68%)`);

      ctx.save();
      ctx.lineWidth = leg.thickness;
      ctx.lineCap = "round";
      ctx.shadowColor = `hsla(${hue}, 85%, 65%, 0.9)`;
      ctx.shadowBlur = 12;
      
      ctx.strokeStyle = legGradient;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + j1x, cy + j1y);
      ctx.lineTo(cx + j2x, cy + j2y);
      ctx.stroke();
      ctx.restore();
    }

    function drawSpider(spider) {
      ctx.save();
      ctx.translate(spider.x, spider.y);
      ctx.scale(spider.bodyScale, spider.bodyScale);

      const time = performance.now() * 0.001;
      const finger = spider.targetFingerId !== null ? fingers[spider.targetFingerId] : null;

      // тело с градиентом
      const bodyGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 14);
      bodyGradient.addColorStop(0, `hsl(${spider.hue}, 90%, 96%)`);
      bodyGradient.addColorStop(0.3, `hsl(${spider.hue}, 80%, 89%)`);
      bodyGradient.addColorStop(0.7, `hsl(${spider.hue}, 70%, 76%)`);
      bodyGradient.addColorStop(1, `hsl(${spider.hue}, 60%, 61%)`);

      ctx.shadowColor = `hsla(${spider.hue}, 90%, 75%, 1)`;
      ctx.shadowBlur = 20;
      ctx.fillStyle = bodyGradient;
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();

      // блик
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.arc(-4, -3, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // лапки
      spider.legs.forEach(leg => {
        drawLeg(leg, 0, 0, time, spider.hue);
      });

      // нить к ближайшему пальцу
      if(finger && finger.active) {
        const dx = finger.x - spider.x;
        const dy = finger.y - spider.y;
        
        const threadGradient = ctx.createLinearGradient(0, 0, dx, dy);
        threadGradient.addColorStop(0, `hsla(${spider.hue}, 85%, 92%, 1)`);
        threadGradient.addColorStop(1, `hsla(${spider.hue}, 85%, 92%, 0.25)`);
        
        ctx.strokeStyle = threadGradient;
        ctx.lineWidth = 1.8;
        ctx.lineCap = "round";
        ctx.shadowColor = `hsla(${spider.hue}, 85%, 85%, 0.9)`;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(dx, dy);
        ctx.stroke();
      }

      ctx.restore();

      // след
      if(spider.trail.length > 1) {
        ctx.save();
        ctx.shadowColor = `hsla(${spider.hue}, 75%, 65%, 0.8)`;
        ctx.shadowBlur = 5;
        for(let i = 0; i < spider.trail.length - 1; i++) {
          const alpha = (i / spider.trail.length) * 0.6;
          ctx.strokeStyle = `hsla(${spider.hue}, 75%, 75%, ${alpha})`;
          ctx.lineWidth = 1.6;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(spider.trail[i].x, spider.trail[i].y);
          ctx.lineTo(spider.trail[i + 1].x, spider.trail[i + 1].y);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(now - lastTime, 50);
      lastTime = now;

      updateBg(dt);
      drawBg();

      assignSpidersToFingers(); // каждый паук выбирает ближайший палец!

      spiders.forEach(spider => {
        updateSpider(spider, dt);
        drawSpider(spider);
      });

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
