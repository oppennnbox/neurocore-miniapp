<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum Flux: Pure</title>
    <style>
        :root { --accent: #00f2ff; --bg: #010103; }
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; outline: none; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Inter', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 40px; left: 30px; z-index: 10; pointer-events: none; color: #fff; }
        .score { font-size: 72px; font-weight: 900; line-height: 1; filter: drop-shadow(0 0 15px var(--accent)); }
        .best { font-size: 14px; opacity: 0.4; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 5px; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); transition: 0.4s; }
        .btn { padding: 24px 85px; background: #fff; color: #000; border: none; border-radius: 100px; font-size: 22px; font-weight: 900; cursor: pointer; letter-spacing: 2px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="best">BEST: <span id="best_val">0</span></div>
        <div class="score" id="score_val">0</div>
    </div>

    <div id="menu" class="overlay">
        <h1 style="color:#fff; letter-spacing: 15px; margin-bottom: 10px; font-weight: 100;">QUANTUM</h1>
        <p style="color:var(--accent); margin-bottom: 50px; font-size: 11px; letter-spacing: 3px;">PURE CORE ACTIVE</p>
        <button class="btn" id="startBtn">START</button>
    </div>

    <canvas id="c"></canvas>

<script>
// --- AUDIO ENGINE ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, type, duration, vol = 0.1, fall = true) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    if(fall) gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

let thrustOsc = null;
let thrustGain = null;

function startThrustSound() {
    if (thrustOsc) return;
    thrustOsc = audioCtx.createOscillator();
    thrustGain = audioCtx.createGain();
    thrustOsc.type = 'sawtooth';
    thrustOsc.frequency.setValueAtTime(90, audioCtx.currentTime);
    thrustGain.gain.setValueAtTime(0, audioCtx.currentTime);
    thrustGain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.1);
    thrustOsc.connect(thrustGain); thrustGain.connect(audioCtx.destination);
    thrustOsc.start();
}

function stopThrustSound() {
    if (thrustGain) thrustGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
    setTimeout(() => { if (thrustOsc) { thrustOsc.stop(); thrustOsc = null; } }, 150);
}

// --- GAME ENGINE ---
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const menu = document.getElementById('menu');
const scoreEl = document.getElementById('score_val');
const bestEl = document.getElementById('best_val');

let dpr = window.devicePixelRatio || 1, w, h, lastTime = 0, time = 0, holding = false, fireParticles = [];
const state = { active: false, playing: false, score: 0, speed: 2.8, best: localStorage.getItem('q_f_best') || 0 };

const player = {
    x: 80, y: 0, w: 36, h: 36, vy: 0, dir: 1, trail: [],
    update(dt) {
        if (!state.playing) {
            this.y = (h / 2 - 18) + Math.sin(time * 0.04) * 15;
            return;
        }
        const gravity = holding ? 0.04 : 0.6;
        this.vy += this.dir * gravity * dt;
        if(holding) {
            this.vy *= Math.pow(0.82, dt);
            if(thrustOsc) thrustOsc.frequency.setValueAtTime(100 + Math.abs(this.vy)*15, audioCtx.currentTime);
            for(let i=0; i<3; i++) fireParticles.push({
                x: this.x + this.w/2 + (Math.random()-0.5)*12,
                y: this.y + (this.dir === -1 ? this.h : 0),
                vx: (Math.random()-0.5)*4, vy: this.dir * -(8 + Math.random()*6),
                life: 1, size: 4 + Math.random()*8
            });
        }
        this.vy = Math.max(-11, Math.min(11, this.vy));
        this.y += this.vy * dt;
        if (time % 2 === 0) {
            this.trail.push({x: this.x, y: this.y, a: 0.5});
            if(this.trail.length > 8) this.trail.shift();
        }
        this.trail.forEach(t => t.a -= 0.06 * dt);
        fireParticles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.08 * dt;
            if(p.life <= 0) fireParticles.splice(i, 1);
        });
        if(this.y < -70 || this.y > h + 70) die();
    },
    draw() {
        fireParticles.forEach(p => {
            ctx.fillStyle = `rgba(0, 242, 255, ${p.life})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
        });
        this.trail.forEach((t, i) => {
            ctx.fillStyle = `rgba(0, 242, 255, ${t.a * 0.1})`;
            ctx.fillRect(t.x + (8-i)*2, t.y, this.w, this.h);
        });
        ctx.save();
        const str = Math.abs(this.vy) * 0.04;
        const sw = this.w * (1 - str), sh = this.h * (1 + str);
        ctx.shadowBlur = 30; ctx.shadowColor = 'rgba(0, 242, 255, 0.6)';
        let g = ctx.createLinearGradient(this.x, this.y, this.x + sw, this.y + sh);
        g.addColorStop(0, '#fff'); g.addColorStop(1, '#00f2ff');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.roundRect(this.x + (this.w-sw)/2, this.y + (this.h-sh)/2, sw, sh, 10); ctx.fill();
        ctx.restore();
    }
};

let obstacles = [];
function spawn() {
    const gap = 265, margin = 140;
    const lastY = obstacles.length ? obstacles[obstacles.length-1].y : h/2;
    let holeY = lastY + (Math.random() - 0.5) * 380;
    holeY = Math.max(margin, Math.min(h - gap - margin, holeY));
    obstacles.push({x: w + 100, y: holeY, gap, w: 75});
}

function start() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playSound(400, 'square', 0.1, 0.05); 
    menu.classList.add('hidden');
    state.active = true; state.playing = false; state.score = 0; state.speed = 2.8;
    player.y = h/2 - 18; player.vy = 0; player.dir = 1; player.trail = [];
    fireParticles = []; obstacles = [];
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function die() {
    state.active = false;
    playSound(60, 'sawtooth', 0.4, 0.2); 
    stopThrustSound();
    if(state.score > state.best) { state.best = Math.floor(state.score); localStorage.setItem('q_f_best', state.best); }
    menu.classList.remove('hidden');
    bestEl.innerText = Math.floor(state.best);
}

function loop(now) {
    if(!state.active) return;
    const dt = Math.min((now - lastTime) / 16.6, 3);
    lastTime = now; time++;

    ctx.fillStyle = '#010103'; ctx.fillRect(0, 0, w, h);
    player.update(dt);
    player.draw();

    if (state.playing) {
        if(obstacles.length === 0 || w - obstacles[obstacles.length-1].x > 420) spawn();
        for(let i=obstacles.length-1; i>=0; i--) {
            let o = obstacles[i];
            o.x -= state.speed * dt;

            ctx.save();
            const r = 24; 
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 35; ctx.shadowColor = 'rgba(255,255,255,0.12)';
            
            ctx.beginPath();
            ctx.roundRect(o.x, -40, o.w, o.y + 40, [0, 0, r, r]);
            ctx.roundRect(o.x, o.y + o.gap, o.w, h - (o.y + o.gap) + 40, [r, r, 0, 0]);
            ctx.fill();
            ctx.restore();

            if(player.x+8 < o.x+o.w && player.x+player.w-8 > o.x) {
                if(player.y+8 < o.y || player.y+player.h-8 > o.y+o.gap) die();
            }
            if(o.x < -100) { 
                obstacles.splice(i, 1); 
                playSound(800, 'sine', 0.03, 0.015);
            }
        }
        state.score += 0.08 * dt;
        state.speed += 0.0004 * dt;
        scoreEl.innerText = Math.floor(state.score);
    }
    requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
});
window.dispatchEvent(new Event('resize'));

document.getElementById('startBtn').addEventListener('click', (e) => { 
    e.stopPropagation(); 
    start(); 
});

window.addEventListener('pointerdown', (e) => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if(e.target.tagName === 'BUTTON') return;
    if(state.active) {
        if(!state.playing) state.playing = true;
        holding = true; player.dir *= -1;
        startThrustSound();
    }
});
window.addEventListener('pointerup', () => { holding = false; stopThrustSound(); });

bestEl.innerText = Math.floor(state.best);

if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        this.moveTo(x + r[0], y);
        this.lineTo(x + w - r[1], y);
        this.arcTo(x + w, y, x + w, y + r[1], r[1]);
        this.lineTo(x + w, y + h - r[2]);
        this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
        this.lineTo(x, y + h);
        this.arcTo(x, y + h, x, y + h - r[3], r[3]);
        this.lineTo(x, y + r[0]);
        this.arcTo(x, y, x + r[0], y, r[0]);
        this.closePath(); return this;
    }
}
</script>
</body>
</html>
